[package]
name = "dot-logger-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
remote = ["dot-logger/remote", "dep:tonic", "dep:tokio", "dep:prost", "dep:tower", "dep:hyper-util", "dep:serde_json"]

integration-example = ["remote", "dot-logger/influxdb", "dot-logger/tracing-adapter"]

[dependencies]
dot-logger = { path = "../dot-logger", default-features = false }
tonic = { workspace = true, optional = true, features = ["tls-ring"] }
tokio = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
log.workspace = true
mcap.workspace = true

[[example]]
name = "remote_query_replay"
required-features = ["remote"]

[[example]]
name = "dot_probe_bridge"
required-features = ["remote"]

[[example]]
name = "dot_probe_check"
required-features = ["remote"]

[[example]]
name = "dot_probe_pipeline"
required-features = ["integration-example"]

[[example]]
name = "dot_probe_tail"
required-features = ["remote"]

[[example]]
name = "lan_probe"
required-features = ["remote"]
