[package]
name = "dot-logger-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dot-logger-client = { path = "../dot-logger-client", features = ["remote"] }
tokio = { workspace = true, features = ["macros", "signal"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
base64 = "=0.22.1"
clap = { workspace = true, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
dot-logger = { path = "../dot-logger", default-features = false, features = ["remote"] }

[lints]
workspace = true
