[package]
name = "dot-logger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
remote = ["dep:tonic", "dep:tokio", "dep:subtle", "tonic/tls-ring"]
influxdb = ["dep:reqwest", "dep:tokio", "dep:bytes"]
tracing-adapter = ["dep:tracing", "dep:log"]
compression-zstd = ["mcap/zstd"]

[dependencies]
rtrb.workspace = true
mcap.workspace = true
prost.workspace = true
tonic = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
log = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

# The raw payload cell is the only audited production unsafe boundary.
# Other workspace packages retain forbid; this package denies unsafe everywhere
# except the private pool/storage module.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[[example]]
name = "scoped_capture"
path = "../../examples/scoped_capture.rs"

[[example]]
name = "telemetry_overhead"
path = "../../examples/telemetry_overhead.rs"
