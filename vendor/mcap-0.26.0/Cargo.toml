# Patched copy of the crates.io `mcap` 0.26.0 package for dot-logger.
# Only the package identity below differs from the published manifest; the
# library is still named `mcap` (see VENDORED.md, ADR-010 amendment 2).

[package]
edition = "2021"
rust-version = "1.81"
name = "dot-logger-mcap"
version = "0.1.1"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "The mcap 0.26.0 crate with the local changes dot-logger needs (MCAP reading and writing)"
homepage = "https://mcap.dev"
publish = false
readme = "README.md"
keywords = [
    "foxglove",
    "mcap",
]
categories = [
    "science::robotics",
    "compression",
]
license = "MIT"
repository = "https://github.com/lim8603/dot-logger"

[features]
default = [
    "zstd",
    "lz4",
]
lz4 = ["dep:lz4"]
tokio = ["dep:tokio"]
zstd = ["dep:zstd"]

[lib]
name = "mcap"
path = "src/lib.rs"

[dependencies.bimap]
version = "0.6.3"

[dependencies.binrw]
version = "0.15"

[dependencies.byteorder]
version = "1.4"

[dependencies.crc32fast]
version = "1.3"

[dependencies.enumset]
version = "1.0.11"

[dependencies.log]
version = "0.4"

[dependencies.lz4]
version = "1.28"
optional = true

[dependencies.num_cpus]
version = "1.13"

[dependencies.paste]
version = "1.0"

[dependencies.static_assertions]
version = "1.1.0"

[dependencies.thiserror]
version = "2.0"

[dependencies.tokio]
version = "1"
features = ["io-util"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.zstd]
version = "0.14"
features = ["zstdmt"]
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies.zstd]
version = "0.14"
features = ["wasm"]
optional = true
