name: Rust contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      # Windows waits are coarse, so the ring and event tests take about 6
      # minutes per feature combination there (8 min with the build, 18
      # combinations): Windows splits the combinations across 3 parallel
      # shards. Every combination still runs on every OS and toolchain; the
      # other steps run once per OS and toolchain (shard 1 on Windows, which
      # has no protocol or consumer step of the matrix script).
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        toolchain: [1.85.0, 1.96.0]
        shard: [0, 1, 2]
        exclude:
          - os: ubuntu-24.04
            shard: 1
          - os: ubuntu-24.04
            shard: 2
          - os: macos-15
            shard: 1
          - os: macos-15
            shard: 2
    runs-on: ${{ matrix.os }}
    env:
      SHARDS: ${{ matrix.os == 'windows-2025' && 3 || 1 }}
      MAIN: ${{ matrix.shard == (matrix.os == 'windows-2025' && 1 || 0) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install fixed Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - name: Record actual environment
        run: |
          rustc +${{ matrix.toolchain }} --version --verbose
          python -c "import platform; print(platform.platform(), platform.machine())"
      - name: Check formatting
        if: matrix.toolchain == '1.96.0' && env.MAIN == 'true'
        run: cargo +${{ matrix.toolchain }} fmt --all --check
      - name: Check all feature combinations and public consumer
        run: python scripts/check-feature-matrix.py --toolchain ${{ matrix.toolchain }} --shard ${{ matrix.shard }}/${{ env.SHARDS }}
      # Workspace-only [patch] settings never reach users (TASK-036). Every OS,
      # so the Windows (fs4) and macOS dependencies resolve unlocked too
      # (REV-072 RV-198).
      - name: External consumer outside the workspace
        if: env.MAIN == 'true'
        run: python scripts/check-external-consumer.py --toolchain ${{ matrix.toolchain }}
      # The feature matrix covers dot-logger; the client, CLI and viewer
      # crates are outside the default members (REV-071 RV-173).
      - name: Client, CLI and viewer tests
        if: env.MAIN == 'true'
        run: |
          cargo +${{ matrix.toolchain }} test --locked -p dot-logger-client --no-default-features
          cargo +${{ matrix.toolchain }} test --locked -p dot-logger-client -p dot-logger-cli -p dot-logger-viewer --all-features
      - name: Clippy
        if: env.MAIN == 'true'
        run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Public API documentation
        if: env.MAIN == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +${{ matrix.toolchain }} doc --workspace --all-features --no-deps --locked
      - name: Core-only API documentation
        if: env.MAIN == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +${{ matrix.toolchain }} doc -p dot-logger --no-default-features --no-deps --locked

  # NFR-008 (TASK-029, API §20): facade surface snapshot and recipe limits.
  integration-surface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install fixed toolchains
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt
          rustup toolchain install nightly-2026-10-26 --profile minimal
      - name: Self-test the surface guard (REV-054)
        run: python scripts/test_check_integration_surface.py
      - name: Self-test the soak drivers (REV-073)
        run: python scripts/test_soak_harness.py
      - name: Check facade surface and recipes
        run: python scripts/check-integration-surface.py

  # TASK-024 S1: native files written on each OS are read back on every OS.
  exchange-write:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Write the exchange set
        run: cargo +1.96.0 run --locked --release -p dot-logger --example os_exchange -- write exchange-out/${{ runner.os }}
      - uses: actions/upload-artifact@v6
        with:
          name: exchange-${{ runner.os }}
          path: exchange-out/${{ runner.os }}
          if-no-files-found: error
          retention-days: 7

  exchange-read:
    needs: exchange-write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - uses: actions/download-artifact@v7
        with:
          pattern: exchange-*
          path: exchange-in
      - name: Read every OS's files
        run: cargo +1.96.0 run --locked --release -p dot-logger --example os_exchange -- verify exchange-in/exchange-Linux exchange-in/exchange-Windows exchange-in/exchange-macOS

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install fixed audit tool
        run: cargo +1.96.0 install cargo-audit --version 0.22.2 --locked
      - name: Check RustSec advisories
        run: cargo +1.96.0 audit --deny unsound

  raw-memory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install fixed Miri toolchain
        run: rustup toolchain install nightly-2026-10-26 --profile minimal --component miri
      - name: Prepare Miri sysroot
        run: cargo +nightly-2026-10-26 miri setup
      - name: Check raw ownership, completion, control, and reclamation
        # Loss checkpoints stamp a wall-clock publish time, which Miri's isolation
        # mode cannot provide; allow host clock access as the local runs do.
        # Tests that use real files and directory fsync, which Miri does not
        # support, are marked `cfg_attr(miri, ignore)` (REV-071 RV-188).
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-disable-isolation -Zmiri-many-seeds=0..8
        run: "cargo +nightly-2026-10-26 miri test -p dot-logger --lib --test tc_002_pool --test tc_003_routing --test tc_003_completion --test tc_003_control --test tc_005_retention --test fault_storage --test tc_006_query --test tc_006_replay --locked"
