[package]
name = "dot-logger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
remote = ["dep:tonic", "dep:tokio", "dep:subtle", "dep:serde_json", "tonic/tls-ring"]
influxdb = ["dep:reqwest", "dep:tokio", "dep:bytes", "dep:serde_json"]
tracing-adapter = ["dep:tracing", "dep:log"]
compression-zstd = ["mcap/zstd"]
# TASK-028 S2 (API §19.8): explicit machine calibration and JSON profiles.
calibrate = ["dep:serde_json"]

[dependencies]
rtrb.workspace = true
mcap.workspace = true
prost.workspace = true
crc32fast.workspace = true
tonic = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
log = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }

# File-output free space on every Unix (statvfs); Linux also places worker
# threads (`thread`: sched_{get,set}affinity).
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["thread"] }

[target.'cfg(windows)'.dependencies]
fs4.workspace = true

[dev-dependencies]
serde_json.workspace = true

# TASK-023 harness only: per-thread affinity and absolute monotonic release.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["thread", "time", "mm"] }

# The raw payload cell is the only audited production unsafe boundary.
# Other workspace packages retain forbid; this package denies unsafe everywhere
# except the private pool/storage module.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[[example]]
name = "scoped_capture"
path = "../../examples/scoped_capture.rs"

[[example]]
name = "telemetry_overhead"
path = "../../examples/telemetry_overhead.rs"

[[example]]
name = "general_logs"
path = "../../examples/general_logs.rs"
required-features = ["tracing-adapter"]

# TASK-029 recipes (NFR-008), checked by scripts/check-integration-surface.py.
[[example]]
name = "recipe_l1_file"
path = "../../examples/recipes/l1_file.rs"

[[example]]
name = "recipe_l2_rt_writers"
path = "../../examples/recipes/l2_rt_writers.rs"

[[example]]
name = "recipe_l3_tracing"
path = "../../examples/recipes/l3_tracing.rs"
required-features = ["tracing-adapter"]

[[example]]
name = "recipe_l3_remote"
path = "../../examples/recipes/l3_remote.rs"
required-features = ["remote"]

# TASK-029 S4: the dot-probe style integration on the facade only.
[[example]]
name = "dot_probe_facade"
path = "../../examples/dot_probe_facade.rs"
required-features = ["remote", "tracing-adapter"]
