[package]
name = "dot-logger-rt-allocation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dot-logger = { path = "../../crates/dot-logger", default-features = false }

# Only this test harness implements GlobalAlloc. Production crates retain the
# workspace-wide unsafe_code = forbid; the allocator module below is isolated.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
