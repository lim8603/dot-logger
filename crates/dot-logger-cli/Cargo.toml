[package]
name = "dot-logger-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "dot-logger"
path = "src/main.rs"

[dependencies]
dot-logger = { path = "../dot-logger", default-features = false, features = ["remote"] }
dot-logger-client = { path = "../dot-logger-client", features = ["remote"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }

[lints]
workspace = true
