name: Rust contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
        toolchain: [1.85.0, 1.96.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - name: Record actual environment
        run: |
          rustc +${{ matrix.toolchain }} --version --verbose
          python -c "import platform; print(platform.platform(), platform.machine())"
      - name: Check formatting
        if: matrix.toolchain == '1.96.0'
        run: cargo +${{ matrix.toolchain }} fmt --all --check
      - name: Check all feature combinations and public consumer
        run: python scripts/check-feature-matrix.py --toolchain ${{ matrix.toolchain }}
      - name: Clippy
        run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +${{ matrix.toolchain }} doc --workspace --all-features --no-deps --locked

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install fixed audit tool
        run: cargo +1.96.0 install cargo-audit --version 0.22.2 --locked
      - name: Check RustSec advisories
        run: cargo +1.96.0 audit --deny unsound
