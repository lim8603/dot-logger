[workspace]
members = ["crates/dot-logger", "crates/dot-logger-client", "crates/dot-logger-cli", "crates/dot-logger-viewer", "tests/api-consumer", "tests/rt-allocation"]
default-members = ["crates/dot-logger"]
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

# Caret ranges so projects that use dot-logger can resolve shared crates
# (ADR-009 amendment, TASK-036). Each lower bound is the version Cargo.lock
# pins and CI tests with --locked; scripts/check-external-consumer.py builds
# against the newest compatible versions instead.
[workspace.dependencies]
rtrb = "0.4.0"
# ADR-010: MCAP 0.26 (security fixes), with local changes kept in
# vendor/mcap-0.26.0 as the `dot-logger-mcap` package. A workspace [patch]
# would not reach downstream users (ADR-010 amendment 2, TASK-036); see
# VENDORED.md and local-changes.patch.
mcap = { package = "dot-logger-mcap", version = "0.1.0", path = "vendor/mcap-0.26.0", default-features = false }
prost = "0.13.5"
# Same version the MCAP writer uses; hardware CRC-32 (EV-105).
crc32fast = "1.5.3"
tonic = { version = "0.13.1", default-features = false, features = ["transport", "codegen", "prost"] }
# Lower bound carries the fix for RUSTSEC-2026-0386.
tokio = { version = "1.51.6", features = ["rt-multi-thread", "net", "sync", "time"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
bytes = "1.12.1"
tracing = "0.1.44"
log = "0.4.29"
subtle = "2.6.1"
tower = { version = "0.5.3", features = ["util"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
clap = { version = "4.6.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Safe Linux filesystem observations on the ordinary host path.
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
