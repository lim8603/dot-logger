<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-logger dashboard</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<header>
  <h1>dot-logger</h1>
  <div id="connection" role="status" aria-live="polite">Loading…</div>
</header>
<main id="main">
  <p id="notice" class="notice" hidden></p>
  <section><h2>Upstream</h2><dl id="identity"></dl></section>
  <section><h2>Latest sample</h2><div id="latest"></div></section>
  <section><h2>Windows</h2><div id="windows" class="cards"></div></section>
  <section><h2>Snapshots</h2><div id="snapshots"></div></section>
</main>
<footer>Read-only. Change configuration or run checks with the dot-logger CLI.</footer>
<script src="dashboard.js"></script>
</body>
</html>
