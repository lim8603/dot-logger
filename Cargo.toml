[workspace]
members = ["crates/dot-logger", "crates/dot-logger-client", "crates/dot-logger-cli", "tests/api-consumer", "tests/rt-allocation"]
default-members = ["crates/dot-logger"]
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
rtrb = "=0.4.0"
# ADR-010: the optional zstd path requires the security fixes in MCAP 0.26.
mcap = { version = "=0.26.0", default-features = false }
prost = "=0.13.5"
tonic = { version = "=0.13.1", default-features = false, features = ["transport", "codegen", "prost"] }
# Same-series security fix for RUSTSEC-2026-0386.
tokio = { version = "=1.51.6", features = ["rt-multi-thread", "net", "sync", "time"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
bytes = "=1.12.1"
tracing = "=0.1.44"
log = "=0.4.29"
subtle = "=2.6.1"
tower = { version = "=0.5.3", features = ["util"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
clap = { version = "=4.6.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# Safe Linux filesystem observations on the ordinary host path.
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# ADR-010 amendment (2026-11-11, EV-068): MCAP 0.26.0 with one patch — an
# uncompressed chunk is hashed once and that CRC serves the data section too
# (upstream hashes the same bytes twice). File bytes are unchanged. See
# vendor/mcap-0.26.0/VENDORED.md.
[patch.crates-io]
mcap = { path = "vendor/mcap-0.26.0" }
